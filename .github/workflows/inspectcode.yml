name: InspectCode

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: inspectcode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  inspectcode:
    name: "ReSharper InspectCode"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore DagEdit.sln

      - name: Run ReSharper InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.11
        with:
          solution: DagEdit.sln
          format: Sarif
          output: inspectcode.sarif.json

      - name: Upload InspectCode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspectcode-sarif
          path: inspectcode.sarif.json
          if-no-files-found: warn
          retention-days: 30
