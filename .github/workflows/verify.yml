name: Verify

# ─── 트리거 ───────────────────────────────────────────────────
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# ─── 동시 실행 제어 ───────────────────────────────────────────
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# ─── 공통 권한 ────────────────────────────────────────────────
permissions:
  contents: read
  security-events: write  # CodeQL SARIF 업로드 용
  actions: read           # gh run download (이전 artifact 취득)용

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Build · Lint · Test · Benchmark Regression Guard
  # ═══════════════════════════════════════════════════════════════
  verify:
    name: "Build · Lint · Test · Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 체크아웃 ─────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ── 2. .NET 8 SDK 설정 ─────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # ── 3. NuGet 캐시 ──────────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 4. 의존성 복원 ─────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore DagEdit.sln

      # ── 5. 빌드 + 린트 경고 수집 ──────────────────────────
      - name: Build & collect analyzer warnings
        id: build
        run: |
          dotnet build DagEdit.sln \
            --no-restore \
            --configuration Release \
            --verbosity normal \
            2>&1 | tee /tmp/build_output.txt

          BUILD_EXIT=${PIPESTATUS[0]}

          # grep -c exits 1 when no matches → "0\n0" 방지용 wc -l 사용
          # TOTAL_WARN는 prefix 일부만 더하지 않고 실제 build warning line 기준으로 집계한다.
          SA_WARN=$(grep -E ": warning SA[0-9]+" /tmp/build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          CA_WARN=$(grep -E ": warning CA[0-9]+" /tmp/build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          CS_WARN=$(grep -E ": warning CS[0-9]+" /tmp/build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          IDE_WARN=$(grep -E ": warning IDE[0-9]+" /tmp/build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_WARN=$(grep -E ": warning [A-Z]{2,}[0-9]+" /tmp/build_output.txt 2>/dev/null | wc -l | tr -d ' ')

          echo "sa_warning_count=$SA_WARN"       >> "$GITHUB_OUTPUT"
          echo "ca_warning_count=$CA_WARN"       >> "$GITHUB_OUTPUT"
          echo "cs_warning_count=$CS_WARN"       >> "$GITHUB_OUTPUT"
          echo "ide_warning_count=$IDE_WARN"     >> "$GITHUB_OUTPUT"
          echo "total_warning_count=$TOTAL_WARN" >> "$GITHUB_OUTPUT"
          echo "build_exit=$BUILD_EXIT"          >> "$GITHUB_OUTPUT"

          exit $BUILD_EXIT

      - name: Fetch previous build warning artifact
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASELINE_BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          echo "Using verify baseline branch: $BASELINE_BRANCH"

          PREV_RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "verify.yml" \
            --branch "$BASELINE_BRANCH" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq ".[] | select(.databaseId | tostring != \"$GITHUB_RUN_ID\") | .databaseId" \
            2>/dev/null | head -1 || true)

          if [ -z "$PREV_RUN_ID" ]; then
            echo "No previous successful verify run found — comparison will be skipped"
            exit 0
          fi

          echo "Previous verify run ID: $PREV_RUN_ID"

          gh run download "$PREV_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "build-warning-count" \
            --dir "_prev_verify_artifact" 2>/dev/null || {
            echo "::warning::Could not download previous build-warning-count artifact"
            exit 0
          }

          FOUND=$(find _prev_verify_artifact -name "build-warning-count.json" -type f | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" prev-build-warning-count.json
            echo "Loaded previous build warning artifact from run $PREV_RUN_ID: $FOUND"
          else
            echo "::warning::build-warning-count.json not found in downloaded artifact"
          fi

      - name: Write build warning count artifact
        if: always()
        env:
          SA_WARN:        ${{ steps.build.outputs.sa_warning_count }}
          CA_WARN:        ${{ steps.build.outputs.ca_warning_count }}
          CS_WARN:        ${{ steps.build.outputs.cs_warning_count }}
          IDE_WARN:       ${{ steps.build.outputs.ide_warning_count }}
          TOTAL_WARN:     ${{ steps.build.outputs.total_warning_count }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "total": int(os.environ.get("TOTAL_WARN", "0") or 0),
              "byPrefix": {
                  "SA": int(os.environ.get("SA_WARN", "0") or 0),
                  "CA": int(os.environ.get("CA_WARN", "0") or 0),
                  "CS": int(os.environ.get("CS_WARN", "0") or 0),
                  "IDE": int(os.environ.get("IDE_WARN", "0") or 0),
              },
              "commit": os.environ.get("GITHUB_SHA", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME", "unknown"),
              "baselineBranch": os.environ.get("GITHUB_BASE_REF") or os.environ.get("GITHUB_REF_NAME", "unknown"),
              "workflowRunId": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "generatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          with open("build-warning-count.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          PYEOF

      - name: Check build warning regression
        if: always()
        env:
          BUILD_EXIT:     ${{ steps.build.outputs.build_exit }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          cur_path = "build-warning-count.json"
          prev_path = "prev-build-warning-count.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          build_exit = os.environ.get("BUILD_EXIT", "")

          def append_summary(text: str) -> None:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(text)

          if build_exit != "0":
              append_summary(
                  "\n### Build warning regression\n\n"
                  "> [INFO] Build failed before warning regression comparison. Build failure remains the source of truth.\n\n"
              )
              print("[INFO] Build failed before regression comparison; skipping build warning regression gate")
              sys.exit(0)

          if not os.path.exists(cur_path):
              print("::warning::build-warning-count.json not found — regression check skipped")
              sys.exit(0)

          if not os.path.exists(prev_path):
              append_summary(
                  "\n### Build warning regression\n\n"
                  "> [INFO] **baseline 없음** — 첫 실행이거나 이전 artifact 없음. 이번 실행이 새 baseline이 된다.\n\n"
              )
              print("[INFO] No previous build warning baseline — regression check skipped")
              sys.exit(0)

          with open(cur_path, encoding="utf-8") as f:
              cur = json.load(f)
          with open(prev_path, encoding="utf-8") as f:
              prev = json.load(f)

          cur_total = int(cur.get("total", 0))
          prev_total = int(prev.get("total", 0))
          prefixes = ("SA", "CA", "CS", "IDE")
          deltas = []
          failed = False

          for prefix in prefixes:
              cur_value = int(cur.get("byPrefix", {}).get(prefix, 0))
              prev_value = int(prev.get("byPrefix", {}).get(prefix, 0))
              if cur_value > prev_value:
                  failed = True
                  deltas.append(f"{prefix} {prev_value} → {cur_value} (+{cur_value - prev_value})")

          if cur_total > prev_total:
              failed = True
              deltas.insert(0, f"total {prev_total} → {cur_total} (+{cur_total - prev_total})")

          def sign(value: int) -> str:
              return f"+{value}" if value > 0 else str(value)

          rows = [
              "| 항목 | 이전 | 현재 | 증감 |",
              "|---|---|---|---|",
              f"| total | {prev_total} | {cur_total} | {sign(cur_total - prev_total)} |",
          ]
          for prefix in prefixes:
              prev_value = int(prev.get("byPrefix", {}).get(prefix, 0))
              cur_value = int(cur.get("byPrefix", {}).get(prefix, 0))
              rows.append(f"| {prefix} | {prev_value} | {cur_value} | {sign(cur_value - prev_value)} |")

          if failed:
              append_summary(
                  "\n### Build warning regression: [FAIL]\n\n"
                  + "\n".join(rows)
                  + f"\n\n> Regression detected: {'; '.join(deltas)}\n\n"
              )
              print(f"::error::Build warning regression detected: {'; '.join(deltas)}")
              sys.exit(1)

          append_summary(
              "\n### Build warning regression: [PASS]\n\n"
              + "\n".join(rows)
              + "\n\n> No build warning regression.\n\n"
          )
          print("[PASS] No build warning regression")
          sys.exit(0)
          PYEOF

      # ── 6. 테스트 + 커버리지 ──────────────────────────────
      - name: Run tests with Cobertura coverage
        id: test
        run: |
          dotnet test tests/DagEdit.Tests/DagEdit.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
            2>&1 | tee /tmp/test_output.txt

          TEST_EXIT=${PIPESTATUS[0]}

          PASSED=$(grep -oP "Passed:\s+\K[0-9]+"  /tmp/test_output.txt | tail -1 || echo 0)
          FAILED=$(grep -oP "Failed:\s+\K[0-9]+"  /tmp/test_output.txt | tail -1 || echo 0)
          SKIPPED=$(grep -oP "Skipped:\s+\K[0-9]+" /tmp/test_output.txt | tail -1 || echo 0)
          TOTAL=$(grep -oP "Total:\s+\K[0-9]+"    /tmp/test_output.txt | tail -1 || echo 0)

          COV_FILE=$(find ./test-results -name "coverage.cobertura.xml" 2>/dev/null | head -1)
          if [ -n "$COV_FILE" ]; then
            LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COV_FILE" | head -1 || echo "N/A")
            COVERAGE_PCT=$(awk "BEGIN { printf \"%.1f\", $LINE_RATE * 100 }")
          else
            COVERAGE_PCT="N/A"
          fi

          echo "passed=$PASSED"             >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED"             >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED"           >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"               >> "$GITHUB_OUTPUT"
          echo "coverage_pct=$COVERAGE_PCT" >> "$GITHUB_OUTPUT"
          echo "test_exit=$TEST_EXIT"       >> "$GITHUB_OUTPUT"

          exit $TEST_EXIT

      # ── 7. 테스트 결과 업로드 ─────────────────────────────
      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ./test-results/*.trx
          retention-days: 30

      # ── 8. 커버리지 리포트 업로드 ─────────────────────────
      - name: Upload coverage report (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: ./test-results/**/coverage.cobertura.xml
          retention-days: 30

      - name: Upload build warning count artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-warning-count
          path: build-warning-count.json
          if-no-files-found: warn
          retention-days: 90

      # ── 9. 벤치마크 기준선 캐시 복원 ──────────────────────
      - name: Restore benchmark baseline cache
        uses: actions/cache/restore@v4
        with:
          path: benchmark-baseline.json
          key: bench-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bench-baseline-${{ runner.os }}-

      # ── 10. 벤치마크 히스토리 캐시 복원 ───────────────────
      - name: Restore benchmark history cache
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/history
          key: bench-history-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bench-history-${{ runner.os }}-

      # ── 11. 벤치마크 빌드 ─────────────────────────────────
      - name: Build benchmark project
        run: |
          dotnet build benchmarks/DagEdit.Benchmarks/DagEdit.Benchmarks.csproj \
            --no-restore \
            --configuration Release

      # ── 12. 벤치마크 실행 (Short Job + JSON 출력) ─────────
      #
      # --job Short: 통계적으로 유효한 실측값을 빠르게 수집한다 (Dry보다 정확).
      # --artifacts: JSON 결과 저장 경로. JsonExporter.Full이 여기에 기록한다.
      - name: Run benchmarks with JSON export
        id: benchmark
        run: |
          dotnet run \
            --project benchmarks/DagEdit.Benchmarks/DagEdit.Benchmarks.csproj \
            --configuration Release \
            --no-build \
            -- --job Short \
               --filter "*" \
               --artifacts ./benchmark-results \
          2>&1 | tee /tmp/bench_output.txt

          BENCH_EXIT=${PIPESTATUS[0]}

          # 생성된 JSON 파일 탐색 (JsonExporter.Full → *-report-full.json)
          BENCH_JSON=$(find ./benchmark-results -name "*-report-full.json" 2>/dev/null | sort | tail -1)
          if [ -z "$BENCH_JSON" ]; then
            BENCH_JSON=$(find ./benchmark-results -name "*.json" 2>/dev/null | sort | tail -1)
          fi

          echo "bench_json=$BENCH_JSON" >> "$GITHUB_OUTPUT"
          echo "bench_exit=$BENCH_EXIT" >> "$GITHUB_OUTPUT"
          exit $BENCH_EXIT

      # ── 13. 성능 회귀 비교 (Regression Guard) ─────────────
      #
      # 이전 성공 빌드의 JSON(benchmark-baseline.json)과 현재 결과를 비교한다.
      # Mean 또는 Allocated 가 10% 이상 악화되면 exit 1 → 빌드 실패.
      # 기준선이 없으면(첫 실행) exit 0 → 성공 처리.
      - name: Compare benchmarks vs baseline (Regression Guard)
        id: bench_compare
        run: |
          BENCH_JSON="${{ steps.benchmark.outputs.bench_json }}"

          if [ -z "$BENCH_JSON" ] || [ ! -f "$BENCH_JSON" ]; then
            echo "⚠️  벤치마크 JSON 파일 없음 — 비교 스킵"
            echo "compare_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/compare_benchmarks.py \
            "benchmark-baseline.json" \
            "$BENCH_JSON"

          COMPARE_EXIT=$?
          echo "compare_exit=$COMPARE_EXIT" >> "$GITHUB_OUTPUT"
          exit $COMPARE_EXIT

      # ── 14. 히스토리 JSON 저장 ────────────────────────────
      - name: Save benchmark result to history
        if: always() && steps.benchmark.outputs.bench_json != ''
        run: |
          BENCH_JSON="${{ steps.benchmark.outputs.bench_json }}"
          if [ -f "$BENCH_JSON" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M%S")
            mkdir -p benchmarks/history
            cp "$BENCH_JSON" "benchmarks/history/${TIMESTAMP}-report.json"
            echo "✅ 히스토리 저장: benchmarks/history/${TIMESTAMP}-report.json"
          fi

      # ── 15. 기준선 업데이트 (master + 회귀 없음 조건) ─────
      - name: Update benchmark baseline
        if: |
          always() &&
          github.ref == 'refs/heads/master' &&
          steps.benchmark.outputs.bench_exit == '0' &&
          steps.bench_compare.outputs.compare_exit == '0'
        run: |
          BENCH_JSON="${{ steps.benchmark.outputs.bench_json }}"
          if [ -f "$BENCH_JSON" ]; then
            cp "$BENCH_JSON" benchmark-baseline.json
            echo "✅ 기준선 업데이트 완료: benchmark-baseline.json"
          fi

      # ── 16. 기준선 캐시 저장 ──────────────────────────────
      - name: Save benchmark baseline cache
        if: |
          always() &&
          github.ref == 'refs/heads/master' &&
          steps.benchmark.outputs.bench_exit == '0' &&
          steps.bench_compare.outputs.compare_exit == '0'
        uses: actions/cache/save@v4
        with:
          path: benchmark-baseline.json
          key: bench-baseline-${{ runner.os }}-${{ github.sha }}

      # ── 17. 히스토리 캐시 저장 ────────────────────────────
      - name: Save benchmark history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: benchmarks/history
          key: bench-history-${{ runner.os }}-${{ github.sha }}

      # ── 18. 벤치마크 아티팩트 업로드 ─────────────────────
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./benchmark-results/
          retention-days: 30

      # ── 19. PR/커밋 요약 작성 ─────────────────────────────
      - name: Write job summary
        if: always()
        env:
          BUILD_EXIT:     ${{ steps.build.outputs.build_exit }}
          SA_WARN:        ${{ steps.build.outputs.sa_warning_count }}
          CA_WARN:        ${{ steps.build.outputs.ca_warning_count }}
          CS_WARN:        ${{ steps.build.outputs.cs_warning_count }}
          IDE_WARN:       ${{ steps.build.outputs.ide_warning_count }}
          TOTAL_WARN:     ${{ steps.build.outputs.total_warning_count }}
          PASSED:         ${{ steps.test.outputs.passed }}
          FAILED:         ${{ steps.test.outputs.failed }}
          SKIPPED:        ${{ steps.test.outputs.skipped }}
          TOTAL:          ${{ steps.test.outputs.total }}
          COVERAGE:       ${{ steps.test.outputs.coverage_pct }}
          TEST_EXIT:      ${{ steps.test.outputs.test_exit }}
          BENCH_EXIT:     ${{ steps.benchmark.outputs.bench_exit }}
          COMPARE_EXIT:   ${{ steps.bench_compare.outputs.compare_exit }}
        run: |
          {
            echo "## 🔍 Verify Report"
            echo ""
            echo "> Branch: \`${{ github.ref_name }}\` | Commit: \`${{ github.sha }}\`"
            echo ""

            # ── 빌드 & 린트 ──────────────────────────────────
            echo "### 🔨 Build & Static Analysis"
            if [ "$BUILD_EXIT" = "0" ]; then BUILD_STATUS="✅ 성공"; else BUILD_STATUS="❌ 실패"; fi
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 빌드 상태 | $BUILD_STATUS |"
            echo "| StyleCop 경고 (SA\*) | $SA_WARN 건 |"
            echo "| Code Analysis 경고 (CA\*) | $CA_WARN 건 |"
            echo "| Roslyn 경고 (CS\*) | $CS_WARN 건 |"
            echo "| IDE 코드스타일 경고 (IDE\*) | $IDE_WARN 건 |"
            echo "| **총 경고** | **$TOTAL_WARN 건** |"
            echo ""
            if [ "$TOTAL_WARN" = "0" ]; then
              echo "> ✅ 분석기 경고 0건 달성!"
            else
              echo "> ⚠️ 경고 $TOTAL_WARN건 존재. [DECISION_LOG DEC-005](docs/DECISION_LOG.md) 참조: 점진적 감소 목표."
            fi
            echo ""

            # ── 테스트 결과 ───────────────────────────────────
            echo "### 🧪 Test Results"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| ✅ 통과 | $PASSED |"
            echo "| ❌ 실패 | $FAILED |"
            echo "| ⏭️ 스킵 | $SKIPPED |"
            echo "| 📊 전체 | $TOTAL |"
            echo "| 📈 라인 커버리지 | ${COVERAGE}% |"
            echo ""
            if [ "$FAILED" = "0" ] && [ "$TOTAL" != "0" ]; then
              echo "> ✅ 모든 테스트 통과"
            elif [ "$FAILED" != "0" ]; then
              echo "> ❌ **$FAILED개 테스트 실패** — 로그 확인 필요"
            fi
            echo ""

            # ── 벤치마크 + 회귀 검사 ─────────────────────────
            echo "### ⚡ Benchmark & Regression Guard"
            echo ""
            if [ "$BENCH_EXIT" = "0" ]; then
              BENCH_STATUS="✅ 측정 완료"
            else
              BENCH_STATUS="❌ 실패"
            fi
            if [ "$COMPARE_EXIT" = "0" ]; then
              REG_STATUS="✅ 회귀 없음 (허용 한도 +10%)"
            elif [ "$COMPARE_EXIT" = "" ]; then
              REG_STATUS="⏭️ 스킵 (JSON 없음)"
            else
              REG_STATUS="❌ **성능 회귀 감지** — 세부 로그 확인"
            fi
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 벤치마크 실행 | $BENCH_STATUS |"
            echo "| 회귀 검사 | $REG_STATUS |"
            echo ""
            echo "> **로컬 전체 측정**: \`cd benchmarks/DagEdit.Benchmarks && dotnet run -c Release -- --filter \"*\"\`"
            echo "> **추이 시각화**: \`pip install matplotlib && python3 scripts/visualize_performance.py\`"
            echo ""

            # ── 아티팩트 ─────────────────────────────────────
            echo "### 📁 Artifacts"
            echo ""
            echo "- **benchmark-results**: BDN JSON 결과 (JsonExporter.Full)"
            echo "- **coverage-cobertura**: Cobertura XML 커버리지 리포트"
            echo "- **test-results-trx**: TRX 형식 테스트 결과 (IDE 임포트 가능)"

          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: CodeQL 보안 분석
  # 참고: https://docs.github.com/en/code-security/code-scanning
  # ═══════════════════════════════════════════════════════════════
  codeql:
    name: "CodeQL Security Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 체크아웃 ─────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ── 2. .NET 8 SDK 설정 ─────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # ── 3. CodeQL 초기화 ────────────────────────────────────
      #
      # queries: security-extended
      #   - security-and-quality: CWE 분류 기반 보안 + 코드 품질 쿼리
      #   - security-extended: 추가 보안 쿼리 (SQL Injection, Path Traversal 등)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      # ── 4. NuGet 복원 ───────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore DagEdit.sln

      # ── 5. 빌드 (CodeQL 추적용) ────────────────────────────
      #
      # autobuild 대신 직접 빌드하여 CodeQL이 정확하게 코드를 추적하게 한다.
      - name: Build for CodeQL
        run: |
          dotnet build DagEdit.sln \
            --no-restore \
            --configuration Release \
            --verbosity minimal

      # ── 6. CodeQL 분석 실행 ─────────────────────────────────
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
